<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI App</title>
    <script>
      // No-FOUC theme bootstrap (research.md §3): applied synchronously, before the
      // React bundle parses, so there is no flash of the wrong theme on first paint.
      // Resolution order: stored preference > prefers-color-scheme > light fallback.
      (function () {
        try {
          var stored = window.localStorage.getItem("ui.theme-preference");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
