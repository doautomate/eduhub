[project]
name = "fastapi-app"
version = "0.1.0"
description = "FastAPI starter scaffold"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic[email]>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "greenlet",
    "alembic",
    "asyncpg",
    "aiosqlite",
    "pyjwt",
    "passlib[argon2]",
    "argon2-cffi",
    "redis",
    "httpx",
    "cryptography",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "fakeredis",
    "testcontainers[postgres]",
    "psycopg2-binary",
    "ruff",
    "mypy",
    "pip-audit",
    "bandit",
    "diff-cover",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
branch = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (line-too-long) is intentionally not enforced: this repo has no line-wrapping
# formatter (ruff format / black) wired in yet, so enforcing a hard length limit here
# would require an unrelated, repo-wide reformatting pass outside this feature's scope.
# UP042 (str+Enum -> enum.StrEnum) is a design-choice modernization, not a bug; left to
# a future, deliberate migration rather than an incidental CI-introduction change.
ignore = ["E501", "UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)`/`Path(...)` in argument defaults is the
# idiomatic dependency-injection pattern, not the mutable-default-argument bug B008
# is designed to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
