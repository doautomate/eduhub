name: CI

on:
  push:
    branches: ['*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    backend:
        name: Backend Build
        runs-on: self-hosted
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Build backend container
              run: docker build -t backend-dev -f backend/Dockerfile.dev backend



#            - name: build backend container
#              run: docker build --target ci -t backend-ci -f backend/Dockerfile backend

#            - name: lint backend code
