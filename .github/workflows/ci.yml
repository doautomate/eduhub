name: CI

on:
  workflow_dispatch:

jobs:
    backend:
        name: Backend Build
        runs-on: self-hosted
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: build backend container
              run: docker build --target ci -t backend-ci -f backend/Dockerfile backend

            - name: lint backend code
              run: docker run --rm backend-ci uv run ruff check . --output-format=github

