services:

  backend:
    restart: always

    command: >
      gunicorn src.main:app
      -k uvicorn.workers.UvicornWorker
      --workers 4
      --bind 0.0.0.0:8000

    environment:
      APP_ENV: production
      LOG_LEVEL: INFO

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    restart: always

  postgres:
    restart: always

  redis:
    restart: always

  nginx:
    image: nginx:alpine
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl

    depends_on:
      - frontend
      - backend

  prometheus:
    image: prom/prometheus
    restart: always

    ports:
      - "9090:9090"

    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    restart: always

    ports:
      - "3001:3000"

    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  grafana_data:
  postgres_data: